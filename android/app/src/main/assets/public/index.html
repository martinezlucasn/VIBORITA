    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <script async src="https://connect.facebook.net/en_US/fbinstant.7.1.js"></script>
    <script>
      // Function to initialize after script loads or if it fails
      function initFB() {
        if (typeof FBInstant !== 'undefined') {
          FBInstant.initializeAsync()
            .then(function() {
              FBInstant.setLoadingProgress(100); 
              return FBInstant.startGameAsync();
            })
            .then(function() {
              window.FB_GAME_READY = true;
              window.dispatchEvent(new Event('fb-instant-ready'));
            })
            .catch(function(error) {
              console.error("Error iniciando el SDK:", error);
              window.FB_GAME_READY = true;
              window.dispatchEvent(new Event('fb-instant-ready'));
            });
        } else {
          // If script didn't load or was blocked
          window.FB_GAME_READY = true;
          window.dispatchEvent(new Event('fb-instant-ready'));
        }
      }

      // Check every 500ms if FBInstant is available (fallback)
      var fbCheckInterval = setInterval(function() {
        if (typeof FBInstant !== 'undefined') {
          clearInterval(fbCheckInterval);
          initFB();
        }
      }, 500);

      // Also set a hard timeout for game entry
      setTimeout(function() {
        if (!window.FB_GAME_READY) {
          clearInterval(fbCheckInterval);
          window.FB_GAME_READY = true;
          window.dispatchEvent(new Event('fb-instant-ready'));
        }
      }, 3000);
    </script>
